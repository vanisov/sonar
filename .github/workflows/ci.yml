name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Sources Icon/make-icon.swift
      - name: Build
        run: DEVELOPER_DIR="$(xcode-select -p)" ./bundle.sh
