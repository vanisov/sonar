name: Release

# Merging a PR that adds a new version section to CHANGELOG.md (e.g. "## [1.5.0] - …") releases it:
# this workflow tags that commit and publishes the build. Pushing a vX.Y.Z tag by hand still works too.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read  # only the release job below can write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find a version to release
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On main: the newest version in the changelog, unless it's already tagged.
          VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$VERSION" ] || git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Nothing to release: the newest changelog version (${VERSION:-none}) is already tagged."
            exit 0
          fi
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: macos-26
    permissions:
      contents: write  # create the tag and the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::The SIGNING_CERT_P12 secret is missing. Releases must be signed with Sonar's certificate."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build
        run: DEVELOPER_DIR="$(xcode-select -p)" SIGN_IDENTITY="Sonar Code Signing" ./bundle.sh

      - name: Check the signature
        run: |
          # The updater only accepts builds signed with this certificate, so a release signed with anything else
          # would strand every user.
          codesign --verify --strict build/Sonar.app
          codesign -d -r- build/Sonar.app 2>&1 | grep -q 'certificate root = H"483718b76021632ea75199da242e0a047fad2a9b"' \
            || { echo "::error::Sonar.app isn't signed with Sonar's certificate."; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          cat >> notes.md <<'NOTES'

          **Install:** unzip, drag Sonar.app into Applications (replace the old one), and open it. Sonar isn't notarized, so the first time macOS will block it: go to System Settings → Privacy & Security and click **Open Anyway**.

          Requires macOS 14+ on Apple silicon.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/Sonar.zip --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # Creates the tag on this commit when it doesn't exist yet (releases from a merge to main).
            gh release create "$TAG" build/Sonar.zip --title "Sonar $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
